version: '3.8'

services:
  plank-db:
    build: .
    container_name: plank-db
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/python
      # Compiled QPY templates survive Java/Python/container restarts.
      QUANTUM_ORACLE_CACHE_DIR: /app/oracle-cache
    volumes:
      - ./python:/app/python
      - oracle-cache:/app/oracle-cache

volumes:
  oracle-cache:
